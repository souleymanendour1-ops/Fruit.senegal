<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b8a5a" />
  <title>Fruit Sénégal — Commandez Alibaba, Shein, Temu, Amazon</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Fruit <span>Sénégal</span></div>
      <div class="spacer"></div>
      <button class="cart-btn" id="cartBtn" aria-label="Panier">🛒
        <span class="cart-count hidden" id="cartCount">0</span>
      </button>
    </header>

    <main class="content" id="view"><!-- contenu injecté --></main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home"><span class="ico">🏠</span>Accueil</button>
      <button class="nav-item" data-tab="catalog"><span class="ico">🛍️</span>Catalogue</button>
      <button class="nav-item" data-tab="link"><span class="ico">🔗</span>Par lien</button>
      <button class="nav-item" data-tab="orders"><span class="ico">📦</span>Commandes</button>
      <button class="nav-item" data-tab="account"><span class="ico">👤</span>Compte</button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
